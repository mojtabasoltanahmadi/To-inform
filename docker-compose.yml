###############################################################################
# Notify — Docker Compose (Phase 5: Redis Caching Isolation)
###############################################################################

services:

  # ---------------------------------------------------------------------------
  # Redis (Dedicated Cache Container with Resource Constraints)
  # ---------------------------------------------------------------------------
  redis:
    image: ${REDIS_IMAGE:-artnexus.partdp.ir/redis:7-alpine}
    container_name: notify-redis-cache
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory 224mb
      --maxmemory-policy allkeys-lru
    mem_limit: 256m
    volumes:
      - redis-cache-data:/data
    networks:
      - notify_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ---------------------------------------------------------------------------
  # Backend (Express API)
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: notify-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: ${PORT:-3000}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
    networks:
      - notify_net
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: >
        wget -qO- http://localhost:${PORT:-3000}/api/health ||
        curl -fs http://localhost:${PORT:-3000}/api/health
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 15s

  # ---------------------------------------------------------------------------
  # Frontend (Nginx + Vue 3 SPA)
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: notify-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    networks:
      - notify_net
    depends_on:
      backend:
        condition: service_healthy

# ---------------------------------------------------------------------------
# Named volumes
# ---------------------------------------------------------------------------
volumes:
  redis-cache-data:
    driver: local

# ---------------------------------------------------------------------------
# Networks
# ---------------------------------------------------------------------------
networks:
  notify_net:
    driver: bridge