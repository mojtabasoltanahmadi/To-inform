###############################################################################
# Notify — Docker Compose
#
# Usage:
#   cp .env.example .env   # fill in secrets
#   docker compose up -d --build
#
# Services:
#   frontend  — Nginx serving the Vue 3 SPA on port 80; proxies /api to backend
#   backend   — Express API on the internal network (not exposed to host)
#   redis     — Redis 7 data store with persistent volume
###############################################################################

services:

  # ---------------------------------------------------------------------------
  # Redis
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - notify_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ---------------------------------------------------------------------------
  # Backend  (Express API)
  # Not exposed to the host — Nginx proxies /api/* to it over the bridge network.
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: ${PORT:-3000}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
    networks:
      - notify_net
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: >
        wget -qO- http://localhost:${PORT:-3000}/api/health ||
        curl -fs http://localhost:${PORT:-3000}/api/health
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 15s

  # ---------------------------------------------------------------------------
  # Frontend  (Nginx + Vue 3 SPA)
  # Exposed on host port 80 (and 443 when a TLS terminator is added in front).
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
    networks:
      - notify_net
    depends_on:
      backend:
        condition: service_healthy

# ---------------------------------------------------------------------------
# Named volumes
# ---------------------------------------------------------------------------
volumes:
  redis_data:
    driver: local

# ---------------------------------------------------------------------------
# Networks
# ---------------------------------------------------------------------------
networks:
  notify_net:
    driver: bridge
