server {
    listen       80;
    server_name  _;

    # -------------------------------------------------------------------------
    # Root and index
    # -------------------------------------------------------------------------
    root  /usr/share/nginx/html;
    index index.html;

    # -------------------------------------------------------------------------
    # Gzip compression
    # -------------------------------------------------------------------------
    gzip            on;
    gzip_types      text/plain text/css application/javascript application/json
                    image/svg+xml font/woff2;
    gzip_min_length 1024;
    gzip_comp_level 5;

    # -------------------------------------------------------------------------
    # API reverse proxy  →  backend service
    # The hostname "backend" is resolved by Docker's internal DNS because both
    # services share the same bridge network defined in docker-compose.yml.
    # -------------------------------------------------------------------------
    location /api/ {
        proxy_pass         http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }

    # -------------------------------------------------------------------------
    # Static assets — aggressive long-term caching (content-hashed filenames)
    # Vite outputs hashed filenames (e.g. index-Dv8kXuH3.js) so we can safely
    # instruct clients to cache these files for 1 year.
    # -------------------------------------------------------------------------
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires    1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # -------------------------------------------------------------------------
    # index.html — NO caching so the browser always fetches the freshest shell
    # that references the correct hashed asset filenames.
    # -------------------------------------------------------------------------
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma        "no-cache";
        add_header Expires       "0";
    }

    # -------------------------------------------------------------------------
    # Vue Router (history mode) SPA fallback
    # Any path that does not match a real file is served as index.html so
    # client-side routing handles it.
    # -------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # -------------------------------------------------------------------------
    # Security headers
    # -------------------------------------------------------------------------
    add_header X-Frame-Options        "SAMEORIGIN"  always;
    add_header X-Content-Type-Options "nosniff"     always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    # -------------------------------------------------------------------------
    # Error pages
    # -------------------------------------------------------------------------
    error_page 404 /index.html;
    error_page 500 502 503 504 /index.html;
}
